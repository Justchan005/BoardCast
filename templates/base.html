<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BoardCast{% endblock %}</title>
{% block web_fonts %}<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
{% endblock %}<link rel="stylesheet" href="/static/style.css?v=20261110-4">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="topbar{% if demo_switcher %} demo-topbar{% endif %}">
  <a class="brand" href="{{ '/demo' if demo_switcher else '/subscribe' }}">
    <span class="brand-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg></span>
    BoardCast
  </a>
  {% if demo_switcher %}{% include '_demo_switcher.html' %}{% endif %}
  <div class="topbar-context">{% block topbar_right %}<span class="muted">Campus Weekly for APU students</span>{% endblock %}</div>
</header>
{% block content %}{% endblock %}
</body>
</html>
