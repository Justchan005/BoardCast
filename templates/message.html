{% extends "base.html" %}
{% block title %}{{ title }} · BoardCast{% endblock %}
{% block content %}
<main class="wrap">
  <div class="card stack">
    <h1 style="font-size:28px">{{ title }}</h1>
    <p style="margin:0">{{ body }}</p>
    {% if link %}<a class="btn secondary" href="{{ link }}" style="align-self:flex-start">{{ link_text }}</a>{% endif %}
  </div>
</main>
{% endblock %}
